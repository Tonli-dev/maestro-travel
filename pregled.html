<!doctype html><html lang="hr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Maestro — pregled na mobitelu</title><style>*{box-sizing:border-box}body{margin:0;background:#e5e7e4;font:14px Arial;color:#203c72}header{padding:14px 20px;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}button,a{font:inherit;color:#203c72;padding:9px 15px;border:1px solid #aab6c5;border-radius:3px;background:white;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#203c72;color:white}iframe{display:block;background:white;width:390px;height:calc(100vh - 80px);max-width:100%;margin:0 auto;border:0;box-shadow:0 5px 30px #203c7222}</style><header><strong>Pregled zaslona</strong><button data-width="390" aria-pressed="true">Mobitel · 390 px</button><button data-width="768" aria-pressed="false">Tablet · 768 px</button><button data-width="1280" aria-pressed="false">Računalo</button><a href="index.html">Otvori stranicu ↗</a></header><iframe src="index.html" title="Maestro Travel — prilagodljivi pregled"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('iframe').style.width=b.dataset.width+'px';document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});</script></html>
